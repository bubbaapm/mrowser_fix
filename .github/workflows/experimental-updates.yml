name: Experimental in-app updates

on:
  push:
    branches: [ experiment/wrapped-hls-segments ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-experimental-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Release skipped: configure four signing secrets first.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.signing.outputs.ready == 'true'
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.ready == 'true'
        with:
          packages: platform-tools
      - name: Install Android SDK
        if: steps.signing.outputs.ready == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore signing keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          {
            echo 'storeFile=release.keystore'
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Build, test, and sign APK
        if: steps.signing.outputs.ready == 'true'
        env:
          MROWSER_EXPERIMENT_BUILD: ${{ github.run_number }}
        run: |
          ./gradlew test
          ./gradlew assembleRelease
      - name: Publish update for TV
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "v1.5.${BUILD_NUMBER}" app/build/outputs/apk/release/app-release.apk \
            --title "Experimental mrowser 1.5.${BUILD_NUMBER}" \
            --notes "Experimental KWP1 HLS support with reduced PNG allocations. Android will request install confirmation." \
            --target "$GITHUB_SHA" \
            --latest
          echo "Published v1.5.${BUILD_NUMBER} for in-app installation" >> "$GITHUB_STEP_SUMMARY"
